<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Oyaji Bros</title>
<style>
  :root { --bg: #fdfbf5; --panel: #f1ece1; --ink: #111111; --muted: #5a554c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: Georgia, "Times New Roman", serif; line-height: 1.5; }
  .wrap { max-width: 40rem; margin: 0 auto; padding: 2rem 1.2rem 4rem; }
  h1 { font-size: 2rem; margin: 0 0 .25rem; }
  .sub { color: var(--muted); margin: 0 0 1.5rem; font-size: .95rem; }
  h2 { font-size: 1rem; color: var(--muted); font-weight: normal; text-transform: uppercase;
       letter-spacing: .12em; margin: 3rem 0 1rem; }
  video { display: block; width: 100%; aspect-ratio: 9 / 16; height: auto;
          border-radius: 8px; background: #000; }
  .logos { display: grid; gap: 1.2rem; }
  .logos figure { margin: 0; background: var(--panel); border-radius: 12px; padding: 1rem; }
  .logos img { width: 100%; height: auto; display: block; border-radius: 6px; }
  figcaption { color: var(--muted); font-size: .9rem; margin-top: .6rem; }
  a { color: var(--ink); text-underline-offset: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Oyaji Bros</h1>
  <p class="sub">Test video and logo mockups. Private page.</p>

  <video controls playsinline preload="metadata">
    <source src="oyaji-bros-test.mp4" type="video/mp4">
    Your browser can't play this video. <a href="oyaji-bros-test.mp4">Download it instead.</a>
  </video>
  <p class="sub" style="margin-top:.8rem"><a href="oyaji-bros-test.mp4" download>Download the video</a></p>

  <h2>Logo mockups</h2>
  <div class="logos">
    <figure>
      <img src="logo-script.png" alt="Oyaji Bros logo, script lettering">
      <figcaption>Script. Red on white, white on red.</figcaption>
    </figure>
    <figure>
      <img src="logo-script-varsity.png" alt="Oyaji Bros logo, script plus varsity lettering">
      <figcaption>Script plus varsity lettering.</figcaption>
    </figure>
    <figure>
      <img src="logo-script-varsity-bar.png" alt="Oyaji Bros logo, script plus varsity lettering on a bar">
      <figcaption>Script plus varsity lettering on a bar.</figcaption>
    </figure>
  </div>
</div>
</body>
</html>
